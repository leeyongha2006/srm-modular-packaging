<template>
    <div class="slds-var-p-around_small">
        <template lwc:if={errorMessage}>
            <p class="slds-text-color_error">{errorMessage}</p>
        </template>
        <template lwc:elseif={isEmpty}>
            <p class="slds-text-color_weak">No contacts.</p>
        </template>
        <template lwc:else>
            <ul class="slds-has-dividers_bottom-space">
                <template for:each={contacts} for:item="contact">
                    <li key={contact.id} class="slds-item">
                        <p class="slds-text-title_bold">{contact.name}</p>
                        <p class="slds-text-body_small">{contact.title}</p>
                    </li>
                </template>
            </ul>
        </template>
    </div>
</template>
